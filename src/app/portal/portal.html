<main class="portal">
  @if (loading()) {
    <p>Cargando…</p>
  } @else if (error()) {
    <p class="portal__error">{{ error() }}</p>
  } @else if (brand(); as brand) {
    <header class="portal__header">
      <h1>{{ brand.name }}</h1>
    </header>

    @for (block of blocks(); track block.id) {
      @if (componentFor(block.type); as cmp) {
        <ng-container *ngComponentOutlet="cmp; inputs: inputsFor(block)" />
      }
    }
  }
</main>
