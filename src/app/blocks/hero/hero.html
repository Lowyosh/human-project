<section class="hero">
  <div class="hero__frame">
    @if (imageUrl(); as url) {
      <img class="hero__image" [src]="url" alt="" />
    }

    @if (logo(); as svg) {
      <div class="hero__logo" [innerHTML]="svg" [attr.aria-label]="brandName()" role="img"></div>
    }

    <div class="hero__text">
      @if (payload().tagline) {
        <p class="hero__tagline">{{ payload().tagline }}</p>
      }

      @if (payload().intro) {
        <p class="hero__intro">{{ payload().intro }}</p>
      }

      @if (payload().year) {
        <p class="hero__year">{{ payload().year }}</p>
      }
    </div>
  </div>

  @if (error()) {
    <p class="hero__error">{{ error() }}</p>
  }
</section>
